[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bestapp"
version = "0.1.0"
description = "BestApp barbershop appointment service"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.163.1",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "SQLAlchemy==2.1.8",
    "psycopg[binary]==3.3.9",
    "alembic==1.20.1",
    "pwdlib[argon2]==0.4.2",
    "PyJWT==2.15.1",
    "PyYAML==6.0.3",
    "tzdata==2026.6",
]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.setuptools.package-data]
app = ["static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = ["integration: requires an explicitly configured PostgreSQL test database"]
