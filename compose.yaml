name: bestapp

x-application: &application
  image: bestapp:local
  build: .
  environment: &application-environment
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bestapp}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-bestapp}
    DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-3}
    DB_QUERY_TIMEOUT_MS: ${DB_QUERY_TIMEOUT_MS:-2000}
    DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-3}

services:
  db:
    image: postgres:17.12-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bestapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bestapp}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    <<: *application
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *application
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 3

  provision:
    <<: *application
    profiles: ["tools"]
    environment:
      <<: *application-environment
      BESTAPP_DEMO_PASSWORD: ${BESTAPP_DEMO_PASSWORD:-}
    command: ["python", "-m", "scripts.provision_demo"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
